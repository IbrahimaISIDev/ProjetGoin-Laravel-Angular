<div class="toast-container">
  <div 
    *ngFor="let toast of toasts()" 
    class="toast toast--{{ toast.type }}"
  >
    <div class="toast__icon">
      <span>{{ getIcon(toast.type) }}</span>
    </div>
    <div class="toast__content">
      <h4 class="toast__title">{{ toast.title }}</h4>
      <p *ngIf="toast.message" class="toast__message">{{ toast.message }}</p>
    </div>
    <button class="toast__close" (click)="dismiss(toast.id)" aria-label="Fermer">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 4L12 12M12 4L4 12" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</div>
