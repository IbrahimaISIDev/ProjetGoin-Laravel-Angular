<section class="tasks-page">
  <header class="tasks-page__header">
    <div class="tasks-page__welcome">
      <div class="tasks-page__avatar">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="20" fill="url(#avatarGradient)"/>
          <path d="M20 10C16.6863 10 14 12.6863 14 16C14 19.3137 16.6863 22 20 22C23.3137 22 26 19.3137 26 16C26 12.6863 23.3137 10 20 10Z" fill="white"/>
          <path d="M10 32C10 27.5817 13.5817 24 18 24H22C26.4183 24 30 27.5817 30 32V34H10V32Z" fill="white" opacity="0.8"/>
          <defs>
            <linearGradient id="avatarGradient" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
              <stop stop-color="#6366F1"/>
              <stop offset="1" stop-color="#A855F7"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div>
        <h1>Mes tâches</h1>
        <p *ngIf="authService.currentUser() as user">
          Bonjour, <strong>{{ user.name }}</strong>
        </p>
      </div>
    </div>

    <button type="button" class="btn-outline" (click)="logout()">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 1L9 17M1 9L9 1L17 9" stroke-linecap="round" stroke-linejoin="round" transform="rotate(180 9 9)"/>
      </svg>
      Déconnexion
    </button>
  </header>

  <form class="task-form" [formGroup]="form" (ngSubmit)="createTask()">
    <div class="task-form__header">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      <span>Nouvelle tâche</span>
    </div>
    
    <label class="field">
      <input 
        type="text" 
        formControlName="title" 
        placeholder="Que devez-vous accomplir ?"
        [class.error]="form.get('title')?.touched && form.get('title')?.invalid"
      />
      <small class="field-error" *ngIf="form.get('title')?.touched && form.get('title')?.hasError('required')">
        Le titre est requis
      </small>
      <small class="field-error" *ngIf="form.get('title')?.touched && form.get('title')?.hasError('maxlength')">
        Le titre ne peut pas dépasser 255 caractères
      </small>
    </label>
    
    <label class="field">
      <textarea 
        formControlName="description" 
        placeholder="Ajoutez une description (optionnel)"
        rows="3"
      ></textarea>
    </label>
    
    <button type="submit" [disabled]="form.invalid" class="btn-primary">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="9" y1="5" x2="9" y2="13"></line>
        <line x1="5" y1="9" x2="13" y2="9"></line>
      </svg>
      Ajouter la tâche
    </button>
  </form>

  <div class="tasks-page__loading" *ngIf="loading()">
    <div class="loading-spinner"></div>
    <p>Chargement de vos tâches...</p>
  </div>

  <div class="tasks-page__empty" *ngIf="!loading() && tasks().length === 0">
    <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="32" cy="32" r="32" fill="#E0E7FF"/>
      <path d="M32 20C28.6863 20 26 22.6863 26 26C26 29.3137 28.6863 32 32 32C35.3137 32 38 29.3137 38 26C38 22.6863 35.3137 20 32 20Z" fill="#6366F1"/>
      <path d="M22 44C22 39.5817 25.5817 36 30 36H34C38.4183 36 42 39.5817 42 44V46H22V44Z" fill="#6366F1" opacity="0.6"/>
    </svg>
    <h3>Aucune tâche</h3>
    <p>Commencez par créer votre première tâche ci-dessus</p>
  </div>

  <ul class="task-list" *ngIf="!loading() && tasks().length > 0">
    <li *ngFor="let task of tasks()" [class.completed]="task.is_done">
      <div class="task-content">
        <label class="task-checkbox" (click)="toggleTask(task)">
          <div class="checkbox-custom" [class.checked]="task.is_done">
            <svg *ngIf="task.is_done" width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M3 8L6 11L13 4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="task-text">
            <strong [class.done-text]="task.is_done">{{ task.title }}</strong>
            <p *ngIf="task.description">{{ task.description }}</p>
            <small class="task-date">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="6" cy="6" r="5"/>
                <path d="M6 3V6L8 8"/>
              </svg>
              {{ task.created_at | date:'medium' }}
            </small>
          </div>
        </label>
      </div>

      <button type="button" class="btn-danger" (click)="deleteTask(task.id)" title="Supprimer">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 6H15M5 6V14C5 14.5304 5.21071 15.0391 5.58579 15.4142C5.96086 15.7893 6.46957 16 7 16H11C11.5304 16 12.0391 15.7893 12.4142 15.4142C12.7893 15.0391 13 14.5304 13 14V6M8 6V4M8 4C8 3.46957 8.21071 2.96086 8.58579 2.58579C8.96086 2.21071 9.46957 2 10 2C10.5304 2 11.0391 2.21071 11.4142 2.58579C11.7893 2.96086 12 3.46957 12 4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </li>
  </ul>
</section>
