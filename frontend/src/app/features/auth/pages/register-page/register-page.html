<section class="auth-page">
  <header class="auth-page__header">
    <div class="auth-page__logo">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="48" height="48" rx="12" fill="url(#gradient1)"/>
        <path d="M24 14L32 26H16L24 14Z" fill="white"/>
        <path d="M16 28H32L24 36L16 28Z" fill="white" opacity="0.6"/>
        <defs>
          <linearGradient id="gradient1" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
            <stop stop-color="#6366F1"/>
            <stop offset="1" stop-color="#A855F7"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <h1>Créer un compte</h1>
    <p>Rejoignez-nous pour organiser vos tâches efficacement</p>
  </header>

  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    <label class="field">
      <span>Nom complet</span>
      <input 
        type="text" 
        formControlName="name" 
        placeholder="Jean Dupont"
        [class.error]="form.get('name')?.touched && form.get('name')?.invalid"
      />
      <small class="field-error" *ngIf="form.get('name')?.touched && form.get('name')?.hasError('required')">
        Le nom est requis
      </small>
    </label>

    <label class="field">
      <span>Adresse email</span>
      <input 
        type="email" 
        formControlName="email" 
        placeholder="nom@exemple.com"
        [class.error]="form.get('email')?.touched && form.get('email')?.invalid"
      />
      <small class="field-error" *ngIf="form.get('email')?.touched && form.get('email')?.hasError('required')">
        L'email est requis
      </small>
      <small class="field-error" *ngIf="form.get('email')?.touched && form.get('email')?.hasError('email')">
        Format d'email invalide
      </small>
    </label>

    <label class="field">
      <span>Mot de passe</span>
      <input 
        type="password" 
        formControlName="password" 
        placeholder="Minimum 8 caractères"
        [class.error]="form.get('password')?.touched && form.get('password')?.invalid"
      />
      <small class="field-error" *ngIf="form.get('password')?.touched && form.get('password')?.hasError('required')">
        Le mot de passe est requis
      </small>
      <small class="field-error" *ngIf="form.get('password')?.touched && form.get('password')?.hasError('minlength')">
        Le mot de passe doit contenir au moins 8 caractères
      </small>
    </label>

    <label class="field">
      <span>Confirmer le mot de passe</span>
      <input 
        type="password" 
        formControlName="password_confirmation" 
        placeholder="••••••••"
        [class.error]="form.get('password_confirmation')?.touched && form.get('password_confirmation')?.invalid"
      />
      <small class="field-error" *ngIf="form.get('password_confirmation')?.touched && form.get('password_confirmation')?.hasError('required')">
        La confirmation est requise
      </small>
      <small class="field-error" *ngIf="form.get('password_confirmation')?.touched && form.get('password_confirmation')?.hasError('mustMatch')">
        Les mots de passe ne correspondent pas
      </small>
    </label>

    <div class="error-message" *ngIf="error()">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
      </svg>
      <span>{{ error() }}</span>
    </div>

    <button type="submit" [disabled]="form.invalid || loading()" class="btn-primary">
      <span *ngIf="!loading()">Créer mon compte</span>
      <span *ngIf="loading()" class="loading-spinner">
        Création en cours...
      </span>
    </button>
  </form>

  <p class="auth-page__footer">
    Déjà un compte ?
    <a routerLink="/login">Se connecter</a>
  </p>
</section>
